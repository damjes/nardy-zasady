<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
	<style>
		.pion-a {
	fill:   hsl( 45, 100%, 90%);
	stroke: hsl( 45,  60%, 60%);
}
.pion-a.fingerdish {
	fill:   hsl( 45,  60%, 75%);
}
.pion-b {
	fill:   hsl(  5, 100%, 45%);
	stroke: hsl(  5, 100%, 35%);
}
.pion-b.fingerdish {
	fill:   hsl(  5, 100%, 40%);
}
.fingerdish {
	stroke: none;
}
	</style>
	<circle class="pion-a" cx="150" cy="150" r="49" stroke-width="2" />
	<circle class="pion-a fingerdish" cx="150" cy="150" r="35" />
	<circle class="pion-b" cx="150" cy="250" r="49" stroke-width="2" />
	<circle class="pion-b fingerdish" cx="150" cy="250" r="35" />
</svg>
