name: Build and Release PDF

on:
  push:
    tags:
      - 'v.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Instalacja zależności
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget curl libgbm1 libasound2t64 locales

      - name: Instalacja draw.io
        run: |
          # DRAWIO_VERSION=$(curl -s https://api.github.com/repos/jgraph/drawio-desktop/releases/latest \
          #   | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          DRAWIO_VERSION="29.7.9" # Wersja 30 się wiesza:
          # https://github.com/damjes/nardy-zasady/actions/runs/25601048183
          # https://github.com/jgraph/drawio-desktop/issues/2426
          # po naprawieniu tego problemu można będzie wrócić do pobierania najnowszej wersji
          # o ile wcześniej nie zmigrujemy na typsta :)
          wget -q "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          sudo apt-get install -y ./drawio-amd64-${DRAWIO_VERSION}.deb

      - name: Instalacja Typst
        run: |
          TYPST_VERSION=$(curl -s https://api.github.com/repos/typst/typst/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          wget -q "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar xf typst-x86_64-unknown-linux-musl.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/

      - name: Instalacja fonta Libertinus Serif
        run: |
          LIBERTINUS_VERSION=$(curl -s https://api.github.com/repos/alerque/libertinus/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          wget -q "https://github.com/alerque/libertinus/releases/download/v${LIBERTINUS_VERSION}/Libertinus-${LIBERTINUS_VERSION}.tar.zst"
          mkdir -p ~/.local/share/fonts/Libertinus
          tar xf Libertinus-${LIBERTINUS_VERSION}.tar.zst --strip-components=2 \
            -C ~/.local/share/fonts/Libertinus \
            --wildcards '*/OTF/Libertinus*.otf'

      - name: Instalacja fonta Iosevka Term Slab Nerd Font
        run: |
          NERD_FONTS_VERSION=$(curl -s https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          wget -q "https://github.com/ryanoasis/nerd-fonts/releases/download/v${NERD_FONTS_VERSION}/IosevkaTermSlab.tar.xz"
          mkdir -p ~/.local/share/fonts/IosevkaTermSlab
          tar xf IosevkaTermSlab.tar.xz -C ~/.local/share/fonts/IosevkaTermSlab

      - name: Odświeżenie pamięci podręcznej fontów
        run: fc-cache -f

      - name: Generowanie polskich lokali
        run: sudo locale-gen pl_PL.UTF-8

      - name: Budowanie PDF-ów
        run: make
        env:
          ELECTRON_DISABLE_SANDBOX: 1
      
      - name: Pobranie wersji z Gita
        id: pobierz_wersje
        run: |
          echo -n "wersja=" >> "$GITHUB_OUTPUT"
          sh gitWersja.sh >> "$GITHUB_OUTPUT"

      - name: Utworzenie wydania na GitHubie
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "Wersja ${{ steps.pobierz_wersje.outputs.wersja }}"
          files: pdf/nardy-*.pdf
          generate_release_notes: true
